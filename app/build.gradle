plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 36
    buildToolsVersion "30.0.3"

    defaultConfig {
        namespace "io.android.sbi"
        applicationId "io.t5.sbi"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation files('libs/NprUtils.jar')
    implementation files('libs/jp2library.aar')
    implementation 'com.drewnoakes:metadata-extractor:2.11.0'
    implementation 'org.apache.commons:commons-lang3:3.0'
    implementation files('libs/jackson/com.fasterxml.jackson.annotations.jar')
    implementation files('libs/jackson/com.fasterxml.jackson.core.jar')
    implementation files('libs/jackson/com.fasterxml.jackson.databind.jar')
    implementation files('libs/okhttp-3.10.0.jar')
    implementation files('libs/okio-1.14.1.jar')
    implementation files('libs/android-sun-jarsign-support-1.1.jar')
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation files('libs/commons-codec-1.4.jar')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'org.bitbucket.b_c:jose4j:0.7.12'
    implementation files('libs/T5Airsnap/AirsnapFaceCore-release.aar')
    implementation files('libs/T5Airsnap/AirsnapFaceUI-release.aar')
    implementation files('libs/T5Airsnap/AirsnapFingerUI-release.aar')
    implementation files('libs/T5Airsnap/T5AirSnap-release.aar')
    implementation files('libs/T5Airsnap/t5ncnn-release.aar')
    implementation files('libs/T5Airsnap/t5opencv-release.aar')

    // CameraX core library
    def camerax_version = '1.5.1'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
}